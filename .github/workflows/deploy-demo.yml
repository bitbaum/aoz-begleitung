name: Deploy AOZ demo

# The real flat (aoz-wohnen.orangecat.ch) is push-to-master CD. The AOZ-branded
# pitch instance at aoz.orangecat.ch is a second build of this repo
# (NEXT_PUBLIC_BRAND is inlined at build time). A laptop `next build` cannot
# fetch Google Fonts from this environment, so the named procedure is this
# workflow — same ship steps as scripts/deploy-demo.sh, run where fonts work.
#
# It does not touch /opt/aoz-wohnen or aoz_wohnen.

on:
  workflow_dispatch: {}

jobs:
  deploy-demo:
    name: aoz-demo → bitbaum
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: aoz-demo-deploy
      cancel-in-progress: false

    # The box address has ONE home: the org-level Actions variable. Steps read
    # it from here, and so does scripts/deploy-demo.sh when run from a step.
    env:
      HETZNER_IP: ${{ vars.HETZNER_IP }}

    steps:
      - name: Require deploy key
        env:
          SSH_KEY: ${{ secrets.HETZNER_SSH_PRIVATE_KEY }}
        run: |
          if [ -z "$SSH_KEY" ]; then
            echo "::error::HETZNER_SSH_PRIVATE_KEY is not set — cannot ship aoz-demo."
            exit 1
          fi

      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      # setup-pnpm's default store nests inside its own bin dir, which breaks
      # any prepare-building dep (portable-type TS2742) — pin it outside.
      - run: pnpm config set store-dir ~/.pnpm-store --global

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Setup SSH
        env:
          SSH_KEY: ${{ secrets.HETZNER_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          # An unset variable interpolates to the empty string, and every ssh,
          # scp and rsync below would then address `ubuntu@` — fail here, loudly.
          if [ -z "${HETZNER_IP:-}" ]; then
            echo "::error::org variable HETZNER_IP is unset"
            exit 1
          fi
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ vars.HETZNER_IP }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Pull demo runtime env from the box
        run: |
          set -euo pipefail
          scp ubuntu@${{ vars.HETZNER_IP }}:/opt/aoz-demo/shared/.env .env.production.local
          # Brand is the reason this is a separate build. Pin it even if the
          # box env drifts — a WG-branded binary on aoz.orangecat.ch is a lie.
          grep -q '^NEXT_PUBLIC_BRAND=' .env.production.local \
            && sed -i 's/^NEXT_PUBLIC_BRAND=.*/NEXT_PUBLIC_BRAND=aoz/' .env.production.local \
            || echo 'NEXT_PUBLIC_BRAND=aoz' >> .env.production.local

      - run: pnpm install --frozen-lockfile

      - name: Build AOZ brand
        env:
          NODE_ENV: production
        run: pnpm run build

      - name: Assemble standalone bundle
        run: |
          cp -r .next/static .next/standalone/.next/static
          cp -r public .next/standalone/public

      - name: Ship
        run: |
          set -euo pipefail
          rsync -az --delete --exclude launch.sh \
            .next/standalone/ ubuntu@${{ vars.HETZNER_IP }}:/opt/aoz-demo/app/
          ssh ubuntu@${{ vars.HETZNER_IP }} \
            'sudo chown -R ubuntu:ubuntu /opt/aoz-demo/app && sudo systemctl restart aoz-demo-app'

      - name: Verify live
        run: |
          set -euo pipefail
          sleep 8
          code=$(curl -s -o /dev/null -w '%{http_code}' https://aoz.orangecat.ch/api/health)
          [ "$code" = "200" ] || { echo "health check failed: $code"; exit 1; }
          html=$(curl -s https://aoz.orangecat.ch/login)
          echo "$html" | grep -q 'AOZ Begleitung' || {
            echo "live page does not carry the AOZ brand — stale build?"
            exit 1
          }
          echo "$html" | grep -q 'loki.orangecat.ch/widget.js' || {
            echo "live page does not carry the Loki widget — stale build?"
            exit 1
          }
          echo "health 200, AOZ brand present, widget snippet present"
