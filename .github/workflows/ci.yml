# Each check is defined ONCE, in package.json (`format:check`, `lint`,
# `typecheck`, `test`); this file only chooses how to group them into jobs.
# `pnpm run verify` runs the same four locally, so green verify ⇒ green CI. The
# e2e suite is separate: it needs a seeded DB and a running server.
#
# `format:check` was in `verify` and NOT here, so the two bundles were not the
# same bundle and the sentence above was false: master failed `pnpm run verify`
# from #181 to #189 on two generated files, with every CI run green. A check
# that only one of the two sides runs is worse than no check — it makes local
# red look like a local problem. Anything added to `verify` gets a step here.
name: CI

on:
  workflow_dispatch: {}
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      # setup-pnpm's default store nests inside its own bin dir, which breaks
      # any prepare-building dep (portable-type TS2742) — pin it outside.
      - run: pnpm config set store-dir ~/.pnpm-store --global

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint

      - name: Type check
        run: pnpm run typecheck

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      # setup-pnpm's default store nests inside its own bin dir, which breaks
      # any prepare-building dep (portable-type TS2742) — pin it outside.
      - run: pnpm config set store-dir ~/.pnpm-store --global

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Run unit tests
        run: pnpm test -- --coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, unit-tests]

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      # setup-pnpm's default store nests inside its own bin dir, which breaks
      # any prepare-building dep (portable-type TS2742) — pin it outside.
      - run: pnpm config set store-dir ~/.pnpm-store --global

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Next keeps its compiler output in .next/cache. Without restoring it this
      # job recompiles the whole app from scratch every run, and the deploy then
      # compiles it again. Measured across the fleet on 2026-09-07: of eight
      # repos, exactly one cached this.
      #
      # Only this job builds — the lint and unit-test jobs above have nothing to
      # cache, so the step belongs here rather than in a shared prelude.
      - name: Cache Next.js build
        uses: actions/cache@v6
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            nextjs-${{ runner.os }}-

      - name: Build
        run: pnpm run build
        env:
          DATABASE_URL: 'postgresql://fake:fake@localhost:5432/fake'
          # Not a real secret: page-data collection imports auth/constants,
          # whose production fail-fast requires this to be set (>=32 chars).
          SESSION_SECRET: 'ci-build-only-dummy-0123456789abcdef'

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    # Deliberately NO `needs:`. This job builds nothing from the Build job — it
    # serves the app with `pnpm run dev` (see playwright.config.ts webServer), so
    # waiting for Build was a dependency in the graph that did not exist in
    # reality. It cost the full lint+unit+build chain (223s) on the critical path
    # of the longest job in the pipeline. Every job here is still a required
    # check; they just no longer queue behind each other.
    # The trade-off, stated: a PR that fails lint now also burns the e2e minutes
    # instead of being cut off early. That is the price of getting all four
    # verdicts at once instead of in sequence.

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aoz_test
          POSTGRES_PASSWORD: aoz_test
          POSTGRES_DB: aoz_housing_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U aoz_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      # setup-pnpm's default store nests inside its own bin dir, which breaks
      # any prepare-building dep (portable-type TS2742) — pin it outside.
      - run: pnpm config set store-dir ~/.pnpm-store --global

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Initialize database schema
        run: pnpm run db:migrate
        env:
          DATABASE_URL: 'postgresql://aoz_test:aoz_test@localhost:5432/aoz_housing_test'

      # Through the npm scripts, never `pnpm ts-node scripts/db/…` directly: the
      # seed imports the product's compatibility algorithm by its `@/` alias,
      # and only the scripts carry `-r tsconfig-paths/register`. Invoking
      # ts-node here by hand was a second definition of "how to seed", and it
      # broke the moment the seed stopped re-implementing the algorithm.
      # Guarded by src/lib/__tests__/scoring-ssot.test.ts.
      - name: Seed E2E data
        run: |
          pnpm run db:seed
          pnpm run db:seed:admin
        env:
          DATABASE_URL: 'postgresql://aoz_test:aoz_test@localhost:5432/aoz_housing_test'
          # A test-only code, matching the default in tests/helpers.ts. The old
          # seed default was published and is refused at login.
          ADMIN_CODE: 'AOZ-E2E001'

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run E2E tests
        run: pnpm run test:e2e
        env:
          DATABASE_URL: 'postgresql://aoz_test:aoz_test@localhost:5432/aoz_housing_test'
          SESSION_SECRET: 'ci-test-secret-not-for-production'
          STAFF_INVITE_CODE: '0000'

      - name: Upload E2E report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
