allowBuilds:
  # git-hosted dep: needs its prepare script to build dist/. pnpm requires the
  # exact resolved spec for git deps, so this key changes if the pinned tag
  # (v0.1.0) ever moves.
  '@parcel/watcher': true
  '@sentry/cli': true
  '@swc/core': true
  '@tailwindcss/oxide': true
  esbuild: true
  sharp: true
  unrs-resolver: true

# Our own packages are published by our own tagged workflows; minimumReleaseAge
# would refuse each fresh publish until it ages. One scope glob covers every
# @bitbaum package; the four unscoped ones are named (fleet SHARED.md).
minimumReleaseAgeExclude:
  - '@bitbaum/*'
  - limitkit
  - bip-kit
  - threadkit
  - ai-forms

# Security floors within the parent packages' supported major ranges. Remove
# these when upstream minimums exclude the vulnerable releases (audit must pass).
overrides:
  'fast-uri@>=3.0.0 <3.1.9': '^3.1.9'
  'vite@>=8.0.0 <8.2.4': '^8.2.4'
